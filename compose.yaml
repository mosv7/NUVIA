# Local development only: internal MongoDB, HTTP loopback origin, file mailbox.
name: nuvia
services:
  mongo:
    image: mongo:7.0.24
    command: [mongod, --replSet, nuvia, --bind_ip_all]
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, 'db.adminCommand({ ping: 1 }).ok']
      interval: 3s
      timeout: 5s
      retries: 20

  mongo-init:
    image: mongo:7.0.24
    entrypoint: [mongosh, --host, mongo:27017, --quiet, /scripts/init-replica.js]
    volumes:
      - ./infra/docker/init-replica.js:/scripts/init-replica.js:ro
    depends_on:
      mongo:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: infra/docker/workspace.Dockerfile
      target: api
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 3001
      MONGODB_URI: mongodb://mongo:27017/?replicaSet=nuvia
      MONGODB_DATABASE: nuvia_development
      APP_ORIGIN: http://127.0.0.1:5173
      MAIL_MODE: file
      JWT_SECRET: ${JWT_SECRET:?Run pnpm setup:local and configure JWT_SECRET first}
      AI_SERVICE_URL: ${AI_CONTAINER_SERVICE_URL:-http://ai:8000}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      AI_REQUEST_TIMEOUT_MS: 190000
    volumes:
      - ./.local/mail:/workspace/.local/mail
    depends_on:
      mongo-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          CMD,
          node,
          --input-type=module,
          -e,
          "const r=await fetch('http://127.0.0.1:3001/api/health/ready');process.exit(r.ok?0:1)",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: infra/docker/workspace.Dockerfile
      target: web
    ports:
      - 127.0.0.1:5173:80
    depends_on:
      api:
        condition: service_healthy

  ai:
    profiles: [ai]
    build:
      context: .
      dockerfile: infra/docker/ai.Dockerfile
      args:
        AI_INFERENCE: ${AI_INFERENCE:-false}
    environment:
      NODE_ENV: production
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      AI_MODEL_ROOT: /models
      AI_DEVICE: cpu
      AI_TASK_TIMEOUT_SECONDS: 180
      AI_BASELINE_MODE: ${AI_BASELINE_MODE:-false}
      AI_SUMMARY_PROVIDER: ${AI_SUMMARY_PROVIDER:-disabled}
      AI_SUMMARY_OUTPUT_TOKENS: ${AI_SUMMARY_OUTPUT_TOKENS:-2048}
      AI_GEMINI_API_KEY: ${AI_GEMINI_API_KEY:-}
      AI_GEMINI_MODEL: ${AI_GEMINI_MODEL:-}
      AI_GROQ_API_KEY: ${AI_GROQ_API_KEY:-}
      AI_GROQ_MODEL: ${AI_GROQ_MODEL:-}
      AI_OLLAMA_URL: ${AI_OLLAMA_URL:-http://127.0.0.1:11434}
      AI_OLLAMA_MODEL: ${AI_OLLAMA_MODEL:-}
      AI_OLLAMA_API_KEY: ${AI_OLLAMA_API_KEY:-}
    ports:
      - 127.0.0.1:8000:8000

volumes:
  mongo-data:
