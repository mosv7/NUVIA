name: Backend and account checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  accounts:
    runs-on: ubuntu-22.04
    env:
      MONGOMS_DOWNLOAD_DIR: /tmp/nuvia-mongodb-binaries
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/cache@v4
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: mongo-7.0.24-${{ runner.os }}-${{ runner.arch }}
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run test:backend
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:accounts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-browser-evidence
          path: test-results/accounts/
          if-no-files-found: ignore
