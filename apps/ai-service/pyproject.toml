[project]
name = "nuvia-ai-service"
version = "0.1.0"
description = "Health-only scaffold for NUVIA's future FastAPI analysis service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.156.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
